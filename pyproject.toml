[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-haircut"
version = "0.2.0"
description = "Slice a Python package down to the code your program actually executes. Production build step for Django and other large libraries."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "CodeHaircut"}]
keywords = ["coverage", "slicing", "dead-code", "trace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "django>=4.2,<6"]

[project.scripts]
haircut = "haircut.cli:main"

[project.urls]
Homepage = "https://github.com/yiheinchai/code-haircut"

[tool.setuptools.packages.find]
include = ["haircut*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
